<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de formulário 002</title>
</head>
<body>
  <h1>Teste de formulário</h1>

  <form action="cadastro.py" method="get" autocomplete="on">

    <p>
      <label for="iemail">E-mail: </label>

      <input type="email" name="email" id="iemail" placeholder="Digite seu e-mail aqui" required autocomplete="email" maxlength="50" size="50">

    </p>

    <p>
      <label for="isenha">Senha: </label>

      <input type="password" name="Senha" id="isenha" placeholder="Digite sua senha aqui" required autocomplete="current-password" maxlength="8" size="20">

    </p>

    <p>
      <input type="submit" value="Enviar">
      <input type="reset" value="Limpar">
    </p>

  </form>
</body>
</html>
