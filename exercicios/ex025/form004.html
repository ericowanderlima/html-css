<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário 004</title>
</head>
<body>
  <h1>Formulário - telefone e e-mail</h1>

  
    <form action="cadastro.py" autocomplete="on">
    
    
      <fieldset>

        <legend>Dados Pessoas</legend>

        <p>
          <label for="inome">Nome: </label>
          <input type="text" name="nome" id="inome">
        </p>
        <p>
          <label for="iemail">E-mail: </label>
          <input type="email" name="email" id="iemail" required autocomplete="email" placeholder="Digite seu email">
        </p>
        <p>
          <label for="itel">Telefone: </label>
          <input type="tel" name="tel" id="itel" required autocomplete="tel" placeholder="(00) 000000000">
        </p>
        <p>
          <input type="submit" value="Enviar">
          <input type="reset" value="Limpar">
        </p>
      </fieldset>

    </form>
  
</body>
</html>
