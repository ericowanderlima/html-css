<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links</title>

  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
    }

    a{
      color: green;
      text-decoration: none;
      font-weight: bold;
    }
    
    a:visited{
      color: red;
    }

    a:hover {
      text-decoration: underline;
      color: black;
    }

    a::before{
      content: '⚓';
      background-color: black;
      border-radius: 50px;
      padding: 2px;
    }

    a::after{
      content: ' [link]';
      color: black;
      font-weight: bolder;
    }

    a:active{
      color: yellow;
    }


  </style>
</head>
<body>
  <h1>Pesonalisando links</h1>
  <ul>
    <li><a href="https//:gustavoguanabara.github.io" target="_blank"> Repositorio github</a></li>
    <li><a href="https//:youtube.com/cursoemvideo"> Canal do youtube</a></li>
    <li><a href="https//:www.cursoemvideo.com"> Site do curso em video</a></li>
  </ul>
</body>
</html>
