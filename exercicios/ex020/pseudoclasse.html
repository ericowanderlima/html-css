<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudo-classes</title>
  <style>
    div{
      text-align: center;
      font-weight: bold;
      height: 200px;
      width: 200px;
      border: 1px solid black;
      display: inline-block;
      background-color: gray;
      
    }

    div:hover{
      background-color: purple;
    }

    
  </style>
</head>
<body>
  <div id="caixa01">01</div>
  <div id="caixa02">02</div>
  <div id="caixa03">03</div>
</body>
</html>
