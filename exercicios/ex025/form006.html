<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário 005 - Cor, Range e file</title>
</head>
<body>
  <h1>Cor, Range e File</h1>

  <form action="cadstro.py" method="post" autocomplete="on">

    <fieldset>

      <legend>
        Foto
      </legend>

      <label for="ifoto">Foto de perfil: </label>
      <input type="file" name="foto" id="ifoto">

    </fieldset>

    <fieldset>

      <legend>
        Cores
      </legend>

      <label for="icor">Cor: </label>
      <input type="color" name="cor" id="icor">

    </fieldset>

    <fieldset>
       <legend>
        Avaliação do teste
       </legend>

       <label for="irange">Nível de sastifação</label>
       <input type="range" name="nivel" id="irange" min="0" max="5">
    </fieldset>

    <input type="submit" value="Enviar">
    <input type="reset" value="limpar">
  </form>
  
</body>
</html>
