<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário 001</title>

  <style>
    *{
      margin: 0px;
      padding: 0px;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      
      h1{
        text-align: center;
        margin-top: 50px;
      }

      form{
        position: absolute;
        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);
        max-width: 200px;
        background-color: rgba(114, 5, 131, 0.51);
        padding: 50px;
        border: 1px solid black;
        border-radius: 10px;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.504);

        div{
          max-width: 50vw;
          padding: 5px;

          input{
            max-width: 100%;
            border-radius: 5px;
            border: 1px solid rgb(0, 30, 255);
            padding: 4px 10px;
          }

          input.botao{
            display: block;
            width: 50%;
            margin: auto;
            margin-top: 20px;
          }

          input.botao:hover{
            background-color: rgba(178, 32, 32, 0.463);
            box-sizing: border-box;
            border: 1px solid black;
            color: white;
          }
        }
      }
    }

  </style>
</head>
<body>
  <h1>Meu primeiro Formulário</h1>

  <form action="cadastro.py" method="post" autocomplete="off">

    <div>
      <p><label for="inome">Nome:</label>
        <input type="text" name="nome" id="inome" placeholder="Digite seu nome aqui"></p>
    </div>

    <div>
      <p><label for="isobrenome">Sobrenome:</label>
        <input type="text" name="sobrenome" id="isobrenome" placeholder="Digite seu sobrenome aqui"></p>
    </div>

    <div>
      <p><input class="botao" type="submit" value="Enviar"></p>
    </div>

  </form>
</body>
</html>
