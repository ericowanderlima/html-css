<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media query - features (caracteristicas)</title>
  <style>
    /* Declarações gerais */
        *{
      margin: 0px;
      padding: 0px;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      width: 100vw;
      height: 100vh;
      background-color: steelblue;
      background-repeat: no-repeat;
      background-size: cover;


      h1{
        color: white;
        text-shadow: 2px 2px 2px black;
        text-align: center;
        padding: 5px;
      }
    }

    /* Declarações retrato */
    @media screen and (orientation:portrait) {
      body{  
        /* ../ significa sair da pasta estilos, entrar na pasta imagens e acessar a foto para modo retrato */

        background-image: url('../imagens/cev-portrait.jpg');
        background-position: left bottom;
      }
      
    }

    /* Declarações paisagem */
    @media screen and (orientation:landscape) {
      body{
        background-image: url('../imagens/cev-landscape.jpg');
        background-position: center bottom;
      }
      
    }
  </style>
</head>
<body>
  <h1>Mude a orientação do seu dispositivo</h1>
</body>
</html>
