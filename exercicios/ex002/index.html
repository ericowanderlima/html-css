<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paragrafos</title>
</head>
<body>
  <h1>Paragrafos e quebra de linhas</h1>
  <hr>
  <p>Você pode escrever o paragrafo de qualquer jeito, basta colocar dentro do &lt;p&gt; &lt;/p&gt;.</p>

  <p>Se precisar quebrar o texto em algum lugar <br> como esse, você pode usar a tag &lt;br&gt;.</p>

  <p>Vamos adicionar alguns símbolos especiais:
    &reg; <!--marca registrada-->
    &copy; <!--copiwrite-->
    &trade; <!---->
    &euro;
    &pound;
    &yen;
    &cent;
    &Delta;
    &uparrow;
    
  </p>

  <p>Vamos adicionar alguns emoji:
    &#x1F913;
  </p>
</body>
</html>
