<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fontes externas</title>
  <style>
    @font-face {
      font-family: 'namorados';
      src: url('fonts/KINKEE__.TTF' format(truetype));
    }

    /*
      tipos de format()
      - opentype (otf)
      - truetype (ttf)
      - embedded-opentype
      - truetype-aat (apple advenced typography)
      - svg
    */
    body{
      font-family: Arial, Helvetica, sans-serif;
    }

    h1{
      font-family: 'namorados', 'Times New Roman', Times, serif;
      font-size: 3em;
      
    }
  </style>
</head>
<body>
  <h1>Titulo</h1>
  <h2>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Eligendi nostrum modi animi et laborum. Rerum harum delectus molestias porro aliquam, placeat, doloribus ad quisquam reprehenderit nemo deserunt consectetur et fugit. </h2>
</body>
</html>
