<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercícios de Tabelas</title>

  <style>
    body{
      font-family: monospace;
      background-color: lightseagreen;
    }

    table{
      background-color: white;
      width: 70vw;
      margin: auto;
      border-collapse: collapse;

      col.colnome{
        background-color: chartreuse;
      }

      col:nth-child(even){
        background-color: brown;
      }

      caption{
        background-color: white;
        border: 2px solid black;
        font-size: 2em;
      }

      th, td{
        border: 2px solid black;
        font-size: 1.5em;
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <h1>Exercício de Tabela</h1>

  <table>

    <colgroup>
      <col class="colnome">
      <col class="colsexo">
      <col class="colidade">
      <col class="colprofissao">

    </colgroup>

    <caption>Cadastro</caption>

    <thead>

      <tr>
        <th scope="col">Nome</th>
        <th scope="col">Sexo</th>
        <th scope="col">Idade</th>
        <th scope="col">Profissão</th>
      </tr>

    </thead>

    <tbody>
      <tr>
        <td>Ana Maria</td>
        <td>F</td>
        <td>25</td>
        <td>Jornalista</td>
      </tr>

      <tr>
        <td>Cláudio</td>
        <td>M</td>
        <td>28</td>
        <td>Programador</td>
      </tr>

      <tr>
        <td>Gustavo</td>
        <td>M</td>
        <td>42</td>
        <td>Professor</td>
      </tr>

      <tr>
        <td>Hélio</td>
        <td>M</td>
        <td>19</td>
        <td>Vendedor</td>
      </tr>

      <tr>
        <td>Maria</td>
        <td>F</td>
        <td>39</td>
        <td>Médica</td>
      </tr>

      <tr>
        <td>Otávio</td>
        <td>M</td>
        <td>22</td>
        <td>Nutricionista</td>
      </tr>
    </tbody>

  </table>
</body>
</html>
