<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabelas</title>

  <style>
    table{
      width: 500px;
      border: 2px solid red;
      border-collapse: collapse;
    }

    td,th{
      border: 1px solid black;
      
    }

    td.num{
      text-align: right;
    }

    
    thead, tfoot{
      background-color: gray;
      color: white;
    }

  </style>
</head>
<body>
  <h1>Uso de tabelas grandes</h1>

  <table>
    <thead>
      <tr>
        <th>Estado</th>
        <th>População</th>
      </tr>
    </thead>
    <tbody>
      <td>Pará</td>
      <td class="num">230.000</td>
    </tbody>
    <tfoot>
      <th>Total de população</th>
      <td class="num"><strong>230.000</strong></td>
    </tfoot>
  </table>
</body>
</html>
