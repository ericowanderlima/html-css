<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo de caixas</title>
  <style>
    *{
      margin: 0px;
      padding: 0px;
    }

         /*box-level*/
    h1{
      background-color: lightblue;
      text-align: center;
      padding: 5px;
      height: 300px;
  
      margin: 10px 10px auto 10px;
      border-width: 5px;
      border-style: double;
      border-color:brown;
      border-radius: 10px;
    }
    h1:hover{
      background-color: rgba(1, 1, 95, 0.562);
      color: rgb(0, 0, 255);
      transition: 0.7s;
      border-color: rgb(255, 255, 0);

      outline-width: 10px;
      outline-style: dotted;
      outline-color: darkorange;
    }

        /*inline-level*/

    a{
      border-width: 5px;
      border-style: groove;
      border-color: brown;
      border-radius: 10px;
      padding: 5px;
    }

    a::before{
        content: '🔗';
      }

    p{
      margin: 20px;
    }
  </style>
</head>
<body>
  <h1>Exemplo de caixas box-level</h1>
  <p>Paragrafos também são exemplos de box-level, mas os <a href="#">LINKS são exemplos de inline-level</a> vamos ver como tudo isso funciona.</p>
</body>
</html>
