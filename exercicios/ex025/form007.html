<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário 007 - </title>
</head>
<body>
  <h1>Formulário 007 - </h1>

  <form action="cadastro.py" method="post" autocomplete="on">

    <fieldset>
      <legend>
        Form 007
      </legend>

      <label for="iest">Estado: </label>
      <select name="est" id="iest">

        <option value="">-- Escolha --</option>

        <optgroup label="Região Sudeste">
          <option value="RJ">Rio de Janeiro</option>
          <option value="SP">São Paulo</option>
          <option value="MG">Minas Gerais</option>
        </optgroup>

        <optgroup label="Região Nordeste">]
          <option value="MA">Maranhão</option>
          <option value="CE">Ceará</option>
          <option value="BA">Bahia</option>
        </optgroup>

      </select>

      <p>
        <label for="iprof">Profissão: </label>
        <input type="text" name="prof" id="iprof" list="lstprof">
        
        <datalist id="lstprof">
          <option value="">-- Escolha Profissão --</option>
          <option value="ADM">Administração</option>
          <option value="Dev">Desenvolvedor</option>
          <option value="Prof">Professor</option>
        </datalist>
      </p>

      <label for="imsg">Mensagem: </label>
      <p>
        <textarea name="msg" id="imsg" cols="30" rows="10" placeholder="Deixe sua mensagem aqui"></textarea>
      </p>
      
    </fieldset>

    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
  </form>
</body>
</html>
