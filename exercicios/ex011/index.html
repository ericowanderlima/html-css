<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mídias em HTML</title>
</head>
<body>
  <h1>Imagens dinamicas</h1>
  <p>Tente abrir esse site em varis dispositivos de tamanhos diferentes ou apenas aumente e diminua o tamnho do seu navegador</p>

  <picture>
    <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
    <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
    <img src="imagens/foto-g.png" alt="Imagem flexilvel">
  </picture>

  <h2>Reproduzindo audio</h2>
  <audio preload="metadata" controls loop> 
    <source src="midia/Paradise - Anno Domini Beats.mp3" type="audio/mpeg">
    <source src="midia/Paradise - Anno Domini Beats.ogg" type="audio/ogg">
    <source src="midia/Paradise - Anno Domini Beats.wav" type="audio/wav">

    <p>Infelismente seu navegador não reproduz audio. <a href="midia/Paradise - Anno Domini Beats.mp3">Clique aqui para baixar</a></p>
  </audio>
</body>
</html>
